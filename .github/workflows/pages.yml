name: build-and-deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 10 * * 1'  # Mondays: pick up new DOL H-1B data (published quarterly)
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: 'Submit every page to IndexNow'
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      h1b_changed: ${{ steps.fetch.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: h1b/requirements.txt
      - run: pip install -r h1b/requirements.txt
      - run: python build.py
      # Processed DOL data is cached so unchanged quarters aren't downloaded and parsed again.
      - uses: actions/cache@v4
        with:
          path: h1b/data
          key: h1b-data-${{ github.run_id }}
          restore-keys: h1b-data-
      - id: fetch
        working-directory: h1b
        run: |
          before=$(sha256sum data/manifest.json 2>/dev/null || true)
          python fetch.py --delete-raw
          after=$(sha256sum data/manifest.json)
          [ "$before" != "$after" ] && echo changed=true >> "$GITHUB_OUTPUT" || echo changed=false >> "$GITHUB_OUTPUT"
      - working-directory: h1b
        env:
          SITE_URL: https://northpeak-studiolabs.github.io/h1b
        run: |
          python build.py --out ../dist/h1b
          python check.py --out ../dist/h1b
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact
      - name: Ping IndexNow (Bing, Yandex and others)
        env:
          INDEXNOW_ALL: ${{ inputs.indexnow_all }}
          H1B_CHANGED: ${{ needs.build.outputs.h1b_changed }}
        run: |
          mkdir -p dist && tar -xf artifact/artifact.tar -C dist
          python indexnow.py
